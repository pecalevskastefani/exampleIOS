name: XCTest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ios:
    runs-on: macos-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Tests on iPhone 17 Simulator (iOS 26.0.1)
      run: |
        xcodebuild test \
          -scheme 'exampleIOS' \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.0.1'

